<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>レゴランド・ジャパン待ち時間モニター</title>

<style>
body{
  font-family: "Helvetica Neue", "Arial", "Hiragino Sans", "Yu Gothic", sans-serif;
  margin:0;
  padding:20px;
  /* レゴブロックをイメージした明るいイエロー背景 */
  background: linear-gradient(135deg, #fef08a, #facc15, #eab308);
  min-height:100vh;
  color:#1e293b;
}

/* タイトル */
h1{
  text-align:center;
  font-size:32px;
  margin-bottom:28px;
  color:#dc2626; /* レゴレッド */
  font-weight:900;
  text-shadow: 2px 2px 0px #ffffff;
  letter-spacing:1px;
}

/* 更新ボタン */
button{
  display:block;
  margin:0 auto 20px auto;
  padding:14px 30px;
  border:none;
  border-radius:12px; /* ブロック感を出すため少し角丸をシャープに */
  background: linear-gradient(90deg, #2563eb, #1d4ed8); /* レゴブルー */
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  box-shadow: 0 6px 14px rgba(37,  99, 235, 0.3);
  transition:.2s;
}

button:hover{
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(37,  99, 235, 0.45);
}

/* 検索ボックス */
.search-area{
  display:flex;
  justify-content:center;
  margin-bottom:22px;
}

.search-area input{
  width:100%;
  max-width:520px;
  padding: 16px 22px;
  border:3px solid #2563eb;
  border-radius:14px;
  font-size:16px;
  font-weight:600;
  color:#0f172a;
  background: white;
  box-shadow: 0 6px 12px rgba(0,0,0,0.05);
  transition:.25s;
}

.search-area input::placeholder{
  color:#94a3b8;
}

.search-area input:focus{
  outline:none;
  border-color: #dc2626;
  box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.2);
}

/* コントロールUI */
.controls{
  display:flex;
  justify-content:center;
  align-items:flex-end;
  gap:18px;
  margin-bottom:30px;
  flex-wrap:wrap;
}

.select-wrap{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.select-wrap label{
  font-size:13px;
  font-weight:800;
  color:#1e293b;
  padding-left:4px;
}

.controls select{
  appearance:none;
  -webkit-appearance:none;
  -moz-appearance:none;
  border: 2px solid #cbd5e1;
  border-radius:12px;
  padding: 12px 40px 12px 16px;
  min-width:210px;
  font-size:15px;
  font-weight:700;
  color:#0f172a;
  background: white;
  cursor:pointer;
  transition:.25s;
  background-image:
    linear-gradient(45deg, transparent 50%, #2563eb 50%),
    linear-gradient(135deg, #2563eb 50%, transparent 50%);
  background-position: calc(100% - 20px) calc(50% - 1px), calc(100% - 14px) calc(50% - 1px);
  background-size: 6px 6px;
  background-repeat:no-repeat;
}

.controls select:focus{
  outline:none;
  border-color: #2563eb;
}

/* グリッド */
.grid{
  display:grid;
  grid-template-columns: repeat(auto-fill,minmax(260px,1fr));
  gap:18px;
}

/* カード */
.card{
  position:relative;
  background:white;
  border-radius:16px;
  padding:18px;
  overflow:hidden;
  box-shadow: 0 8px 16px rgba(0,0,0,0.06);
  border: 2px solid #e2e8f0;
  transition:.2s;
}

/* レゴブロックのカラフルなトップライン */
.card::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:8px;
  background: linear-gradient(90deg, #dc2626, #2563eb, #eab308, #16a34a);
}

.card:hover{
  transform:translateY(-4px);
  box-shadow: 0 12px 24px rgba(0,0,0,0.12);
}

.name{
  font-size:18px;
  font-weight:700;
  line-height:1.4;
  margin-bottom:12px;
  color:#0f172a;
  min-height: 50px; /* 高さを揃えて見やすく */
}

.wait{
  font-size:42px;
  font-weight:900;
  line-height:1;
}

/* 待ち時間の色（レゴランドはUSJほど激混みしないため基準を少し低めに設定可能） */
.wait.low{ color:#16a34a; }   /* 緑 */
.wait.middle{ color:#ea580c; }/* オレンジ */
.wait.high{ color:#dc2626; }  /* 赤 */

.status{
  margin-top:12px;
  color:#64748b;
  font-size:13px;
  font-weight: 600;
}

.loading{
  background:white;
  border-radius:16px;
  padding:30px;
  text-align:center;
  font-weight: bold;
  box-shadow: 0 8px 16px rgba(0,0,0,0.06);
}

.updated{
  text-align:center;
  margin-top:28px;
  color:#1e293b;
  font-size:14px;
  font-weight: bold;
}

.footer{
  margin-top:50px;
  padding:30px 20px;
  text-align:center;
  border-top: 2px solid rgba(0,0,0,0.1);
  color:#475569;
  font-size:13px;
  line-height:1.8;
}

.footer-note{
  margin-top:10px;
  font-size:12px;
  color:#64748b;
}

@media (max-width:640px){
  body{ padding:14px; }
  h1{ font-size:24px; }
  .grid{ grid-template-columns:1fr; }
  .wait{ font-size:36px; }
  .controls{ flex-direction:column; align-items:stretch; }
  .controls select{ width:100%; min-width:unset; }
}
</style>
</head>

<body>

<h1>
レゴランド・ジャパン<br>
リアルタイム待ち時間モニター
</h1>

<button onclick="loadData()">更新</button>

<!-- 検索 -->
<div class="search-area">
  <input type="text" id="searchInput" placeholder="アトラクションを検索...">
</div>

<!-- 並び替え・フィルター -->
<div class="controls">
  <div class="select-wrap">
    <label>並び替え</label>
    <select id="sortSelect">
      <option value="wait-desc">待ち時間が長い順</option>
      <option value="wait-asc">待ち時間が短い順</option>
      <option value="name">名前順</option>
    </select>
  </div>

  <div class="select-wrap">
    <label>フィルター</label>
    <select id="filterSelect">
      <option value="all">すべて</option>
      <option value="operating">運営中のみ</option>
      <option value="busy">待ち時間 30分以上</option>
    </select>
  </div>
</div>

<div id="list" class="grid"></div>
<div class="updated" id="updated"></div>

<footer class="footer">
  <p>© 2026 レゴランドジャパン待ち時間モニター All Rights Reserved.</p>
  <p class="footer-note">
    ※本サイトは個人が制作した非公式のファンサイトであり、レゴランド・ジャパンおよび運営会社とは一切関係ありません。
  </p>
  <p class="footer-note">
    ※非公式のAPIから待ち時間情報を取得しているため、公式の情報と異なることがあります。<br>
    本情報の利用により生じた損害について、当サイトは一切の責任を負いません。
  </p>
</footer>

<script>
// レゴランド・ジャパンのAPI URL
const LEGOLAND_URL = "https://api.themeparks.wiki/v1/entity/0c14c187-13f5-41ef-91b1-7ecb504239a7/live";

/* 英語名から日本語名への変換辞書（レゴランド・ジャパン用） */
const nameJP = {
  "The Dragon": "ザ・ドラゴン",
  "Dragon's Apprentice": "ドラゴン・アプレンティス",
  "Submarine Adventure": "サブマリン・アドベンチャー",
  "Lost Kingdom Adventure": "ロスト・キングダム・アドベンチャー",
  "Splash Battle": "スプラッシュ・バトル",
  "Coast Guard HQ": "コースト・ガード・エイチキュー",
  "Driving School": "ドライビング・スクール",
  "Jr. Driving School": "ジュニア・ドライビング・スクール",
  "Rescue Academy": "レスキュー・アカデミー",
  "Cargo Ace": "カーゴ・エース",
  "City Airport": "シティ・エアポート",
  "The Wharf": "ザ・ワーフ",
  "Squid Surfer": "スクイッド・サーファー",
  "Wave Racer": "ウェーブ・レーサー",
  "Beetle Bounce": "ビートル・バウンス",
  "Pharaoh's Revenge": "ファラオ・リベンジ",
  "Anchors Away!": "アンカー・アウェイ！",
  "Castaway Camp": "キャスタウェイ・キャンプ",
  "Cole's Rock Climb": "コールのロック・クライム",
  "Kai's Sky Masters": "カイ・スカイ・マスター",
  "Lloyd's Spinjitzu Spinner": "ロイド・スピン術・スピナー",
  "Jay's Lightning Drill": "ジェイ・ライトニング・ドリル",
  "Merlin's Flying Machines": "マーリン・フライング・マシーン",
  "Merlin's Challenge": "マーリン・チャレンジ",
  "Observation Tower": "オブザベーション・タワー",
  "Brick Party": "ブリック・パーティ",
  "DUPLO® Express": "デュプロ・エクスプレス",
  "DUPLO® Play": "デュプロ・プレイ",
  "LEGO ® Factory Tour": "レゴ・ファクトリー・ツアー",
  "LEGO® Ninjago Live": "レゴ・ニンジャゴー・ライブ",
  "Workshop": "レゴ・クリエイティブ・ワークショップ",
  "Police Building Experience": "ポリス・ビルディング・エクスペリエンス",
  "Cole's Rock Climbing Wall": "コールのロック・クライム・ウォール",
  "Rainbow Design Studio": "レインボー・デザイン・スタジオ",
  "Build a Boat": "ビルド・ア・ボート",
  "The Secret Chamber of Amset-ra": "シークレット・チャンバー・オブ・アムセトラ",
  "Kingdom Games": "キングダム・ゲーム（ゲームコーナー）",
  "Flying NINJAGO": "フライング・ニンジャゴー",
  "NINJA Games": "ニンジャ・ゲーム（ゲームコーナー）",
  "Blue Coat Games": "ブルー・コート・ゲーム（ゲームコーナー）",
  "Ocean King Games": "オーシャン・キング・ゲーム（ゲームコーナー）",
  "Miniland": "ミニランド",
  "Cat Cloud Busters": "キャット・クラウド・バスターズ",
  "Stop&Go Games": "ストップ＆ゴー・ゲーム（ゲームコーナー）",
  "Imagination Celebration": "イマジネーション・セレブレーション",
  "S.Q.U.I.D. Surfer": "スクイッド・サーファー",  "Palace Cinema": "パレス・シネマ",
  "Splash Pad": "スプラッシュ・パッド",
  "Splash Pad【Only for the Summer season】": "スプラッシュ・パッド【夏季限定】",
  "Build and Test": "ビルド・アンド・テスト",
  "Robotic Play Centre": "ロボティック・プレイ・センター",
  "Rebuild The Word Center": "リビルド・ザ・ワールド・センター",
  "Water Maze": "ウォーター・メイズ"
};

function statusJP(status){
  switch(status){
    case "OPERATING": return "運営中";
    case "DOWN": return "休止中";
    case "CLOSED": return "終了";
    case "REFURBISHMENT": return "メンテナンス休止";
    default: return status;
  }
}

// レゴランドの混雑度に合わせて基準値を少し低めに調整（30分/15分）
function waitClass(wait){
  if(wait >= 45) return "high";
  if(wait >= 20) return "middle";
  return "low";
}

function createLoading(text){
  const div = document.createElement("div");
  div.className = "loading";
  div.textContent = text;
  return div;
}

function createCard(item){
  const card = document.createElement("div");
  card.className = "card";

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = nameJP[item.name] || item.name;

  const waitDiv = document.createElement("div");
  waitDiv.className = "wait";

  const waitTime = item.queue?.STANDBY?.waitTime;
  if(waitTime != null){
    waitDiv.textContent = waitTime + "分";
    waitDiv.classList.add(waitClass(waitTime));
  } else {
    waitDiv.textContent = "--";
    waitDiv.classList.add("low");
  }

  const status = document.createElement("div");
  status.className = "status";
  status.textContent = statusJP(item.status);

  card.appendChild(name);
  card.appendChild(waitDiv);
  card.appendChild(status);

  return card;
}

async function loadData(){
  const list = document.getElementById("list");
  list.innerHTML = "";
  list.appendChild(createLoading("レゴランドのデータを読み込み中..."));

  try{
    const res = await fetch(LEGOLAND_URL);
    if (!res.ok) throw new Error(`APIエラー ${res.status}`);
    
    const data = await res.json();
    let attractions = (data.liveData || []).filter(x => x.entityType === "ATTRACTION");

    const filterType = document.getElementById("filterSelect").value;
    const sortType = document.getElementById("sortSelect").value;
    const keyword = document.getElementById("searchInput").value.toLowerCase();

    /* 検索 */
    if(keyword){
      attractions = attractions.filter(x => {
        const jpName = nameJP[x.name] || x.name;
        return jpName.toLowerCase().includes(keyword);
      });
    }

    /* フィルター */
    if(filterType === "operating"){
      attractions = attractions.filter(x => x.status === "OPERATING");
    }
    if(filterType === "busy"){
      attractions = attractions.filter(x => (x.queue?.STANDBY?.waitTime ?? 0) >= 30);
    }

    /* 並び替え */
    if(sortType === "wait-desc"){
      attractions.sort((a,b) => (b.queue?.STANDBY?.waitTime ?? -1) - (a.queue?.STANDBY?.waitTime ?? -1));
    }
    if(sortType === "wait-asc"){
      attractions.sort((a,b) => (a.queue?.STANDBY?.waitTime ?? 999) - (b.queue?.STANDBY?.waitTime ?? 999));
    }
    if(sortType === "name"){
      attractions.sort((a,b) => {
        const aName = nameJP[a.name] || a.name;
        const bName = nameJP[b.name] || b.name;
        return aName.localeCompare(bName, "ja");
      });
    }

    list.innerHTML = "";
    if(attractions.length === 0){
      list.appendChild(createLoading("該当するアトラクションが見つかりません"));
    } else {
      attractions.forEach(item => {
        list.appendChild(createCard(item));
      });
    }

    document.getElementById("updated").textContent = "最終更新: " + new Date().toLocaleString("ja-JP");

  }catch(err){
    console.error(err);
    list.innerHTML = "";
    list.appendChild(createLoading("データの取得に失敗しました。時間をおいて再度お試しください。"));
  }
}

document.getElementById("sortSelect").addEventListener("change", loadData);
document.getElementById("filterSelect").addEventListener("change", loadData);
document.getElementById("searchInput").addEventListener("input", loadData);

// 初回読み込み
loadData();
// 1分ごとに自動更新
setInterval(loadData, 60000);
</script>

</body>
</html>
